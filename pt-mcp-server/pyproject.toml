[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pt-mcp-server"
version = "1.0.0"
description = "Model Context Protocol (MCP) Server for Real-Time Cisco Packet Tracer Orchestration"
readme = "README.md"
authors = [
    { name = "Principal Network Architect & Lead Software Engineer", email = "architect@cisco-mcp.internal" }
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.8.0",
]

[project.scripts]
pt-mcp-server = "src.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src"]

